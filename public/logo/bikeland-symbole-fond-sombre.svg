<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="512" height="512" role="img" aria-label="Bike Land">
  <title>Bike Land — symbole</title>
  <!-- Une roue dont les rayons forment une boussole. L aiguille pointe
       vers le nord-est : le depart en voyage. -->
  <g fill="none" stroke="#f2efe9">
    <circle cx="20" cy="20" r="17.5" stroke-width="2.4"/>
    <g stroke-width="1.1" opacity="0.32">
      <line x1="20" y1="20" x2="20" y2="4.5"/>
      <line x1="20" y1="20" x2="20" y2="4.5" transform="rotate(45 20 20)"/>
      <line x1="20" y1="20" x2="20" y2="4.5" transform="rotate(90 20 20)"/>
      <line x1="20" y1="20" x2="20" y2="4.5" transform="rotate(135 20 20)"/>
    </g>
  </g>
  <path d="M27.5 12.5 22.6 22.6 12.5 27.5 17.4 17.4Z" fill="#f25c05"/>
  <circle cx="20" cy="20" r="3.4" fill="#f2efe9"/>
</svg>
